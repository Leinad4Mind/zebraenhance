anavaro_zebraenhance_close_friend:
    path: /zebraenhance/close-friend/{userid}/{state}
    defaults: { _controller: anavaro.zebraenhance.controller:set_close_friend }
    methods: [POST]
    requirements:
        userid: \d+
        state: 0|1

anavaro_zebraenhance_manage_request:
    path: /zebraenhance/request/{requestid}/{action}
    defaults: { _controller: anavaro.zebraenhance.controller:manage_request }
    methods: [POST]
    requirements:
        requestid: \d+
        action: accept|decline|cancel
