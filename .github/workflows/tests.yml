name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-compatibility:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  coding-standard:
    name: phpBB coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Run phpBB coding standard
        run: vendor/bin/phpcs --standard=vendor/senky/phpbb-coding-standard/ruleset.xml --exclude=Generic.Functions.CallTimePassByReference --ignore='vendor/*' --extensions=php .

  phpbb-tests:
    name: phpBB ${{ matrix.phpbb }} / PHP ${{ matrix.php }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phpbb: '3.3.0'
            php: '7.4'
            composer: 'v1'
          - phpbb: '3.3.17'
            php: '7.4'
            composer: 'v2'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none
          tools: composer:${{ matrix.composer }}
      - name: Prepare phpBB ${{ matrix.phpbb }}
        run: |
          git clone --depth 1 --branch release-${{ matrix.phpbb }} https://github.com/phpbb/phpbb.git phpbb
          composer install --working-dir=phpbb/phpBB --no-interaction --no-progress
          mkdir -p phpbb/phpBB/ext/anavaro
          mkdir -p phpbb/phpBB/ext/anavaro/zebraenhance
          rsync -a --exclude=.git --exclude=phpbb --exclude=vendor --exclude=dist "$GITHUB_WORKSPACE/" phpbb/phpBB/ext/anavaro/zebraenhance/
      - name: Run extension tests
        working-directory: phpbb
        run: phpBB/vendor/bin/phpunit -c phpBB/ext/anavaro/zebraenhance/phpunit.xml.dist --testsuite 'Extension Test Suite' --colors=always

  functional-tests:
    name: phpBB ${{ matrix.phpbb }} / PHP ${{ matrix.php }} functional tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phpbb: '3.3.0'
            php: '7.4'
            composer: 'v1'
          - phpbb: '3.3.17'
            php: '7.4'
            composer: 'v2'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none
          tools: composer:${{ matrix.composer }}
      - name: Prepare phpBB ${{ matrix.phpbb }}
        run: |
          git clone --depth 1 --branch release-${{ matrix.phpbb }} https://github.com/phpbb/phpbb.git phpbb
          composer install --working-dir=phpbb/phpBB --no-interaction --no-progress
          mkdir -p phpbb/phpBB/ext/anavaro
          mkdir -p phpbb/phpBB/ext/anavaro/zebraenhance
          rsync -a --exclude=.git --exclude=phpbb --exclude=vendor --exclude=dist "$GITHUB_WORKSPACE/" phpbb/phpBB/ext/anavaro/zebraenhance/
      - name: Run functional tests
        working-directory: phpbb
        run: |
          php -S 127.0.0.1:8099 -t phpBB > "$RUNNER_TEMP/zebraenhance-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export PHPBB_FUNCTIONAL_URL=http://127.0.0.1:8099/
          for attempt in {1..30}; do
            curl --fail --silent "$PHPBB_FUNCTIONAL_URL" > /dev/null && break
            sleep 1
          done
          if ! phpBB/vendor/bin/phpunit -c phpBB/ext/anavaro/zebraenhance/phpunit.xml.dist --testsuite 'Extension Functional Tests' --colors=always; then
            cat "$RUNNER_TEMP/zebraenhance-server.log"
            exit 1
          fi

  extension-pre-validator:
    name: phpBB Extension Pre-Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Install EPV
        run: |
          git clone --depth 1 https://github.com/phpbb/epv.git "$RUNNER_TEMP/epv"
          composer install --working-dir="$RUNNER_TEMP/epv" --no-interaction --no-progress
      - name: Validate extension
        run: |
          mkdir -p "$RUNNER_TEMP/epv-stage/anavaro/zebraenhance"
          rsync -a --exclude=.git --exclude=phpunit.xml.dist "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/epv-stage/anavaro/zebraenhance/"
          php "$RUNNER_TEMP/epv/src/EPV.php" run --dir="$RUNNER_TEMP/epv-stage"
